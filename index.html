<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>妍妍 & 文文</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #9a93b8, #b9add6, #c7b1d6);
        font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
        color: #222;
        overflow-x: hidden;
    }
    .nav {
        width: 460px;
        margin: 80px auto;
        padding: 24px;
        background: #f4f4ff;
        border-radius: 18px;
        border: 1px solid #a89bd1;
        box-shadow: 0 8px 24px rgba(90, 79, 126, 0.25);
        text-align: center;
        opacity: 0;
        transform: translateY(-14px);
        animation: fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    h1 {
        font-size: 24px;
        color: #4b3f6b;
        margin-bottom: 10px;
        letter-spacing: 3px;
        animation: titleJump 2s infinite;
    }
    @keyframes titleJump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
    }
    .desc {
        font-size: 14px;
        color: #555;
        margin-bottom: 24px;
    }
    a {
        display: block;
        padding: 11px;
        margin: 10px 0;
        background: #b9add6;
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        border-radius: 12px;
        border: 1px solid #8a7fb3;
        transition: 0.2s;
    }
    a:hover {
        background: #7a6fa5;
        transform: scale(1.04);
    }
    .tip {
        margin-top: 20px;
        font-size: 12px;
        color: #666;
    }
    .heart {
        position: fixed;
        color: #e56db1;
        font-size: 20px;
        pointer-events: none;
        animation: floatUp linear forwards;
    }
    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(0.6);
            opacity: 0;
        }
        20% {
            opacity: 1;
        }
        100% {
            transform: translateY(-110vh) scale(1.2);
            opacity: 0;
        }
    }
</style>
</head>
<body>

<div class="nav">
    <h1>妍妍 & 文文</h1>
    <div class="desc">普通的小页面，记录普通的喜欢</div>
    <a href="yifengxin.html">✉️ 打开那封信</a>
    <a href="jishiqi.html">💞 查看相恋时间</a>
    <div class="tip">妍妍和文文的小站</div>
</div>

<script>
    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "♥";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = (14 + Math.random() * 16) + "px";
        heart.style.animationDuration = (6 + Math.random() * 4) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 600);
</script>

</body>
</html>
