<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一封信</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #b9add6, #d8c6e8, #e8c7dc);
        font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
        color: #333;
    }
    .letter {
        width: 540px;
        margin: 50px auto;
        padding: 28px;
        background: #fff;
        border-radius: 20px;
        border: 1px solid #b8a9dc;
        box-shadow: 0 10px 28px rgba(122, 111, 165, 0.22);
    }
    h2 {
        font-size: 22px;
        color: #4b3f6b;
        margin-bottom: 16px;
        text-align: center;
    }
    .line {
        font-size: 16px;
        line-height: 2;
        margin: 12px 0;
        color: #444;
        opacity: 0;
        transform: translateX(-10px);
        animation: slideIn 0.9s forwards;
    }
    .line:nth-child(2) { animation-delay: 0.3s; }
    .line:nth-child(3) { animation-delay: 0.7s; }
    .line:nth-child(4) { animation-delay: 1.1s; }
    .line:nth-child(5) { animation-delay: 1.5s; }
    .line:nth-child(6) { animation-delay: 1.9s; }
    @keyframes slideIn {
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    .right {
        text-align: right;
    }
    .btn {
        display: inline-block;
        padding: 9px 22px;
        background: #b9add6;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        border: 1px solid #8a7fb3;
        font-size: 15px;
        margin-top: 24px;
        transition: 0.2s;
    }
    .btn:hover {
        background: #7a6fa5;
    }
    .tag {
        display: inline-block;
        background: #f3d9e8;
        border-radius: 10px;
        border: 1px dashed #b06e92;
        padding: 2px 10px;
        font-size: 13px;
        color: #b06e92;
        margin-left: 6px;
        animation: blink 1.4s infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }
</style>
</head>
<body>

<div class="letter">
    <h2>To 妍妍</h2>

    <div class="line">致妍妍：</div>
    <div class="line">和你相处的每一天，都让我觉得格外珍贵。</div>
    <div class="line">不用多么轰轰烈烈，平平淡淡也很好。</div>
    <div class="line">很庆幸能够遇见，能够陪伴在你的身边。</div>
    <div class="line">希望我们可以一直这样走下去。<span class="tag">妍妍文文</span></div>
    <div class="line right">文文</div>

    <a class="btn" href="index.html">返回首页</a>
</div>

</body>
</html>
