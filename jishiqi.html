<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            min-height: 100vh;
            background-color: #080c18;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: #cbd5e1;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            padding:20px 16px;
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 640px;
            text-align: center;
        }
        .main-title {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 42px;
            color: #e2e8f0;
        }
        .avatar-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 48px;
        }
        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(203, 213, 225, 0.25);
            flex-shrink: 0;
            background: #141a2b;
        }
        /* 缩小爱心容器 */
        .heart-wrap{
            width:80px;
            height:72px;
            flex-shrink:0;
            position:relative;
            animation: breath 6s ease-in-out infinite;
        }
        @keyframes breath {
            0%{transform:scale(1)}
            50%{transform:scale(1.03)}
            100%{transform:scale(1)}
        }
        .heart-shell{
            width:100%;
            height:100%;
        }
        .heart-shell path{
            fill:none;
            stroke:rgba(236, 182, 202, 0.48);
            stroke-width:1.3;
            stroke-linecap:round;
            stroke-linejoin:round;
        }
        .heart-inner{
            position:absolute;
            inset:0;
            overflow:hidden;
            border-radius:inherit;
        }
        .heart-text{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            font-size:14px;
            color:rgba(236, 182, 202, 0.65);
            letter-spacing:2px;
            pointer-events:none;
        }
        .particle{
            position:absolute;
            color:rgba(236, 182, 202, 0.55);
            pointer-events:none;
        }
        .time-text {
            font-size: 22px;
            letter-spacing: 1px;
            color: #cbd5e1;
            font-variant-numeric: tabular-nums;
            line-height:1.6;
        }
        .total-time-text{
            margin-top:12px;
            font-size:17px;
            opacity:0.65;
            font-variant-numeric: tabular-nums;
            line-height:1.5;
        }
        .footer-note {
            margin-top: 44px;
            opacity: 0.48;
            font-size: 14px;
            line-height: 1.8;
        }
        .back-box{
            margin-top:32px;
        }
        .back-btn{
            padding:9px 26px;
            border:1px solid #ecb6ca;
            color:#ecb6ca;
            background:transparent;
            border-radius:8px;
            font-size:14px;
            cursor:pointer;
            transition:0.3s;
        }
        .back-btn:hover{
            background:rgba(236,182,202,0.08);
        }
        @media (max-width: 480px) {
            .avatar {
                width: 70px;
                height: 70px;
            }
            .heart-wrap{
                width:62px;
                height:56px;
            }
            .heart-text{
                font-size:12px;
            }
            .time-text {
                font-size: 16px;
            }
            .total-time-text{
                font-size:14px;
            }
            .main-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="container">
    <div class="main-title">我们在一起已经</div>
    <div class="avatar-group">
        <img id="avaLeft" class="avatar" src="avatar-left.jpg" alt="小怡">
        <div class="heart-wrap">
            <svg class="heart-shell" viewBox="0 0 100 90">
                <path d="M50,22 C28,8 8,26 12,50 C16,74 50,86 50,86 C50,86 84,74 88,50 C92,26 72,8 50,22 Z" />
            </svg>
            <div class="heart-inner" id="particleBox">
                <div class="heart-text">Love</div>
            </div>
        </div>
        <img id="avaRight" class="avatar" src="avatar-right.jpg" alt="启元">
    </div>
    <div class="time-text" id="timeDisplay"></div>
    <div class="total-time-text" id="totalTimeDisplay"></div>
    <div class="footer-note">
        我们的故事于 2026-09-30 22:00:00 开始<br>
        by 启元and小怡
    </div>
    <div class="back-box">
        <button class="back-btn" onclick="location.href='index.html'">返回中转站</button>
    </div>
</div>
<script>
    document.getElementById('avaLeft').src = "avatar-left.jpg";
    document.getElementById('avaRight').src = "avatar-right.jpg";
    const startDate = new Date(2026, 8, 30, 22, 0, 0);
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    let meteors = [];
    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < 350; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.1 + 0.15,
            speed: Math.random() * 0.22 + 0.04
        });
    }
    function spawnMeteor() {
        meteors.push({
            x: Math.random() * w * 0.4 + w * 0.6,
            y: Math.random() * h * 0.3,
            len: Math.random() * 55 + 35,
            speedX: -1.2,
            speedY: 1.2,
            opacity: 0.75
        });
    }
    function draw() {
        ctx.fillStyle = "#080c18";
        ctx.fillRect(0, 0, w, h);
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(210,225,255," + (0.22 + Math.random() * 0.3) + ")";
            ctx.fill();
            s.y += s.speed;
            if (s.y > h) {
                s.y = 0;
                s.x = Math.random() * w;
            }
        });
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(m.x + m.len, m.y - m.len);
            ctx.strokeStyle = "rgba(255,255,255," + m.opacity + ")";
            ctx.lineWidth = 1.4;
            ctx.stroke();
            m.x += m.speedX;
            m.y += m.speedY;
            m.opacity -= 0.007;
            if (m.opacity <= 0) meteors.splice(i, 1);
        }
        requestAnimationFrame(draw);
    }
    draw();
    setInterval(spawnMeteor, 4200);
    setTimeout(()=>{
        canvas.style.opacity = "1";
    },100);
    const particleBox = document.getElementById("particleBox");
    let particleList = [];
    function createParticle(){
        const el = document.createElement("div");
        el.className = "particle";
        const isHeart = Math.random()>0.45;
        el.innerText = isHeart ? "♥" : "●";
        const size = isHeart ? 12 + Math.random()*8 : 4 + Math.random()*6;
        el.style.fontSize = size + "px";
        const cx = particleBox.offsetWidth/2;
        const cy = particleBox.offsetHeight/2;
        const radiusInit = 5 + Math.random()*12;
        const angle = Math.random() * Math.PI *2;
        const p = {
            el,
            x: cx + Math.cos(angle)*radiusInit,
            y: cy + Math.sin(angle)*radiusInit,
            baseY: cy,
            phase: Math.random()*Math.PI*2,
            speed: 0.012 + Math.random()*0.008,
            expandSpeed: 0.12 + Math.random()*0.18,
            radius: radiusInit,
            alpha:0.6
        };
        particleList.push(p);
        updateDomPos(p);
        particleBox.appendChild(el);
    }
    function updateDomPos(p){
        p.el.style.left = p.x + "px";
        p.el.style.top = p.y + "px";
        p.el.style.opacity = p.alpha;
    }
    function particleLoop(){
        const boxW = particleBox.offsetWidth;
        const boxH = particleBox.offsetHeight;
        const cx = boxW/2;
        const cy = boxH/2;
        for(let i=particleList.length-1;i>=0;i--){
            const p = particleList[i];
            p.phase += p.speed;
            const wave = Math.sin(p.phase)*5;
            p.radius += p.expandSpeed;
            p.x = cx + Math.cos(p.phase*0.45) * p.radius;
            p.y = cy + wave;
            p.alpha -= 0.0045;
            updateDomPos(p);
            // 最大扩散半径改成36，适配小爱心
            if(p.alpha <=0 || p.radius>36){
                p.el.remove();
                particleList.splice(i,1);
            }
        }
        requestAnimationFrame(particleLoop);
    }
    setInterval(createParticle,320);
    particleLoop();
    const timeDom = document.getElementById("timeDisplay");
    const totalTimeDom = document.getElementById("totalTimeDisplay");
    function calcTimeText() {
        const now = new Date();
        let diff = now.getTime() - startDate.getTime();
        if(diff < 0) diff = 0;
        const secTotal = Math.floor(diff / 1000);
        const s = secTotal % 60;
        const m = Math.floor(secTotal / 60) % 60;
        const h = Math.floor(secTotal / 3600) % 24;
        const daysAll = Math.floor(secTotal / 86400);
        let y = 0, mon = 0, d = daysAll;
        while(true){
            const nextYear = new Date(startDate.getFullYear()+y+1, startDate.getMonth(), startDate.getDate());
            const dayOneYear = (nextYear - new Date(startDate.getFullYear()+y, startDate.getMonth(), startDate.getDate())) / 86400000;
            if(d >= dayOneYear){
                d -= dayOneYear;
                y++;
            }else break;
        }
        while(true){
            const nextMon = new Date(startDate.getFullYear()+y, startDate.getMonth()+mon+1, startDate.getDate());
            const dayOneMon = (nextMon - new Date(startDate.getFullYear()+y, startDate.getMonth()+mon, startDate.getDate())) / 86400000;
            if(d >= dayOneMon){
                d -= dayOneMon;
                mon++;
            }else break;
        }
        const hh = String(h).padStart(2,"0");
        const mm = String(m).padStart(2,"0");
        const ss = String(s).padStart(2,"0");
        const totalHours = Math.floor(secTotal / 3600);
        const totalMinutes = Math.floor(secTotal / 60);
        const totalSeconds = secTotal;
        return {
            normal:`${y} 年 · ${mon} 月 · ${d} 日 · ${hh} : ${mm} : ${ss}`,
            total:`总 ${totalHours} 小时 | 总 ${totalMinutes} 分钟 | 总 ${totalSeconds} 秒`
        }
    }
    function render(){
        const res = calcTimeText();
        timeDom.innerText = res.normal;
        totalTimeDom.innerText = res.total;
    }
    render();
    setInterval(render,1000);
</script>
</body>
</html>
