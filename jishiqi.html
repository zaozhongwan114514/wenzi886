<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>计时器</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #9a93b8, #b9add6, #c7b1d6);
        font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
        color: #222;
    }
    .timer {
        width: 580px;
        margin: 60px auto;
        padding: 30px;
        background: #f4f4ff;
        border-radius: 22px;
        border: 1px solid #a89bd1;
        box-shadow: 0 10px 28px rgba(90, 79, 126, 0.25);
        text-align: center;
    }
    h2 {
        font-size: 22px;
        color: #4b3f6b;
        margin-bottom: 20px;
        animation: titleJump 2s infinite;
    }
    @keyframes titleJump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
    .avatars {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 24px;
        margin-bottom: 24px;
    }
    .avatar {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        border: 1px solid #8a7fb3;
        object-fit: cover;
        background: #b9add6;
    }
    .heart {
        font-size: 26px;
        color: #e56db1;
        animation: beat 1s infinite;
    }
    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }
    .time {
        font-size: 17px;
        line-height: 2;
        color: #333;
        background: #fff;
        border-radius: 14px;
        border: 1px dashed #a89bd1;
        padding: 14px;
        margin: 16px 0;
    }
    .tip {
        font-size: 13px;
        color: #666;
        margin-top: 14px;
    }
    .btn {
        display: inline-block;
        padding: 9px 22px;
        background: #b9add6;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        border: 1px solid #8a7fb3;
        font-size: 15px;
        margin-top: 22px;
        transition: 0.2s;
    }
    .btn:hover {
        background: #7a6fa5;
    }
</style>
</head>
<body>
<div class="timer">
    <h2>妍妍 & 文文 在一起已经</h2>
    <div class="avatars">
        <img class="avatar" src="avatar-left.jpg" alt="妍妍">
        <div class="heart">♥</div>
        <img class="avatar" src="avatar-right.jpg" alt="文文">
    </div>
    <div class="time" id="timeDisplay"></div>
    <div class="tip">开始时间：2026-10-04 21:00:00</div>
    <a class="btn" href="index.html">返回首页</a>
</div>
<script>
    const startDate = new Date(2026, 9, 4, 21, 0, 0);
    const timeDom = document.getElementById("timeDisplay");

    function updateTime() {
        const now = new Date();
        let diff = now.getTime() - startDate.getTime();
        if (diff < 0) diff = 0;

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor(totalSeconds / 3600) % 24;
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const seconds = totalSeconds % 60;

        timeDom.innerHTML =
            days + " 天 " +
            hours + " 小时 " +
            minutes + " 分钟 " +
            seconds + " 秒";
    }

    updateTime();
    setInterval(updateTime, 1000);
</script>
</body>
</html>
